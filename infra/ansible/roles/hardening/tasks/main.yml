---
- name: Ensure fail2ban and ufw are installed
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
    state: present
    update_cache: true
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: Restart sshd
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart sshd
- name: Allow SSH via UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
- name: Allow HTTP via UFW
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
- name: Allow HTTPS via UFW
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
- name: Allow k3s internal traffic via UFW
  community.general.ufw:
    rule: allow
    from_ip: 10.0.0.0/16
- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
